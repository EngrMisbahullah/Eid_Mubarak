<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Eid Dashboard - Visitor Count</title>
    <meta
      name="description"
      content="Live visitor counter for Eid Mubarak card."
    />
    <style>
      :root{
        --night:#050d1a;
        --deep:#0a1628;
        --gold:#d4a843;
        --gold-light:#f0c96a;
        --ivory:#fdf6e3;
      }
      *{ margin:0; padding:0; box-sizing:border-box; }
      body{
        min-height:100vh;
        background: radial-gradient(1200px 600px at 50% 20%, rgba(212,168,67,0.10), transparent 60%), var(--night);
        color:var(--ivory);
        font-family: Arial, Helvetica, sans-serif;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:16px;
      }
      .card{
        width:min(920px, 100%);
        background: linear-gradient(135deg, rgba(10,22,40,0.9), rgba(5,13,26,0.95));
        border:1px solid rgba(212,168,67,0.3);
        border-radius:18px;
        padding:22px;
        box-shadow: 0 0 60px rgba(212,168,67,0.08);
      }
      header{
        display:flex;
        align-items:flex-start;
        justify-content:space-between;
        gap:12px;
        flex-wrap:wrap;
        margin-bottom:18px;
      }
      h1{
        font-size: clamp(22px, 4vw, 34px);
        color: var(--gold-light);
        line-height:1.1;
      }
      .sub{
        margin-top:6px;
        color: rgba(253,246,227,0.8);
        font-size:14px;
      }
      .grid{
        display:grid;
        grid-template-columns: 1fr;
        gap:14px;
      }
      .stat{
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(212,168,67,0.22);
        border-radius:14px;
        padding:18px;
        text-align:center;
      }
      .label{
        color: rgba(253,246,227,0.75);
        letter-spacing: 0.5px;
        font-size:13px;
        text-transform: uppercase;
      }
      .value{
        margin-top:10px;
        font-size: clamp(46px, 8vw, 64px);
        color: var(--ivory);
        text-shadow: 0 0 22px rgba(212,168,67,0.2);
        font-weight:800;
      }
      .actions{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:12px;
        flex-wrap:wrap;
        margin-top:14px;
      }
      button, a{
        appearance:none;
        border:1px solid rgba(212,168,67,0.45);
        background: rgba(10,22,40,0.6);
        color: var(--gold-light);
        padding:10px 14px;
        border-radius: 999px;
        font-weight:700;
        cursor:pointer;
        text-decoration:none;
      }
      button:hover, a:hover{
        background: rgba(212,168,67,0.12);
      }
      .note{
        margin-top:14px;
        color: rgba(253,246,227,0.7);
        font-size: 13px;
        line-height: 1.5;
      }
      @media (max-width: 520px){
        .card{ padding:16px; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <div>
          <h1>Visitor Dashboard ✨</h1>
          <div class="sub">Live total visitors for your Eid card.</div>
        </div>
        <div class="sub" id="status">Loading...</div>
      </header>

      <section class="grid">
        <div class="stat">
          <div class="label">Total visitors</div>
          <div class="value" id="count">-</div>
          <div class="actions">
            <button id="refreshBtn" type="button">Refresh</button>
            <a href="./eid-mubarak.html">Back to Card</a>
          </div>
          <div class="note">
            This uses <b>countapi.xyz</b>. It counts global hits, and the main page also uses
            <code>localStorage</code> guard so it won’t increment multiple times per browser/device.
          </div>
        </div>
      </section>
    </main>

    <script>
      const COUNTAPI_NAMESPACE = 'eid-mubarak';
      const COUNTAPI_KEY = 'visitors';
      const statusEl = document.getElementById('status');
      const countEl = document.getElementById('count');
      const refreshBtn = document.getElementById('refreshBtn');

      async function loadCount(){
        statusEl.textContent = 'Loading...';
        countEl.textContent = '-';
        try{
          const res = await fetch(`https://api.countapi.xyz/get/${COUNTAPI_NAMESPACE}/${COUNTAPI_KEY}`, {
            method: 'GET',
            mode: 'cors'
          });
          const data = await res.json();
          countEl.textContent = data.value ?? '0';
          statusEl.textContent = 'Updated just now';
        }catch(e){
          statusEl.textContent = 'Failed to load (check internet)';
          countEl.textContent = '-';
        }
      }

      refreshBtn.addEventListener('click', loadCount);
      loadCount();
    </script>
  </body>
</html>
