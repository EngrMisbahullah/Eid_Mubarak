<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="55%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0c96a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#d4a843" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative stars -->
  <g fill="#f0c96a" opacity="0.9">
    <circle cx="140" cy="120" r="5"/>
    <circle cx="220" cy="210" r="3"/>
    <circle cx="360" cy="140" r="4"/>
    <circle cx="980" cy="120" r="5"/>
    <circle cx="1060" cy="210" r="3"/>
    <circle cx="860" cy="150" r="4"/>
  </g>

  <!-- Main text -->
  <text x="600" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#f0c96a" text-anchor="middle">
    Eid Mubarak (
  </text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#fdf6e3" opacity="0.9" text-anchor="middle">
    May Allah bless you with peace & joy
  </text>

  <!-- Bottom strip -->
  <path d="M0 470 C220 410, 420 520, 600 470 C780 420, 980 520, 1200 460 L1200 630 L0 630 Z" fill="#0a1628" opacity="0.85"/>
  <text x="600" y="545" font-family="Arial, sans-serif" font-size="26" fill="#d4a843" opacity="0.95" text-anchor="middle">
    Send this card to your loved ones
  </text>
</svg>

